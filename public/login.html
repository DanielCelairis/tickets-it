<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login | CELAIRIS SOLUTIONS</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div class="login-container">
  <img src="/img/logo-celairis.png" style="display:block;margin:0 auto 15px" height="60">
  <h3>CELAIRIS SOLUTIONS</h3>

  <input id="usuario" placeholder="Usuario">
  <input id="password" type="password" placeholder="Contraseña">
  <button onclick="login()">Ingresar</button>

  <p id="msg" style="color:red; text-align:center;"></p>
</div>

<script>
function login() {
  const usuarioVal = document.getElementById("usuario").value;
  const passwordVal = document.getElementById("password").value;
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if (!usuarioVal || !passwordVal) {
    msg.innerText = "Completa usuario y contraseña";
    return;
  }

  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      usuario: usuarioVal,
      password: passwordVal
    })
  })
  .then(res => res.json())
  .then(data => {
    if (data.ok) {
      location.href = "/";
    } else {
      msg.innerText = "Credenciales incorrectas";
    }
  })
  .catch(err => {
    console.error(err);
    msg.innerText = "Error de conexión. Intenta nuevo.";
  });
}
</script>

</body>
</html>
